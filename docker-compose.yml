services:
  api:
    build: .
    container_name: myastro-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: myastro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myastro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myastro_secret}
      POSTGRES_DB: myastro
    # SECURITY: Only expose to internal Docker network, not host
    # Uncomment ports below ONLY for local development
    # ports:
    #   - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myastro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myastro-redis
    restart: unless-stopped
    # SECURITY: Require password for Redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-myastro_redis_secret}
    # SECURITY: Only expose to internal Docker network
    # Uncomment ports below ONLY for local development
    # ports:
    #   - "127.0.0.1:6379:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-myastro_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: myastro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
